name: Dashboard checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/multilingual-content-editor

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test dashboard
        run: npm test

      - name: Build dashboard
        run: npm run build
